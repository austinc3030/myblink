<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#71717a">
    <title>MyBlink - Camera Management</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/static/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <style>
        :root {
            --primary: #71717a;
            --primary-dark: #52525b;
            --surface: #ffffff;
            --surface-alt: #f4f4f5;
            --border: #e4e4e7;
            --text: #18181b;
            --text-secondary: #71717a;
            --success: #10b981;
            --error: #ef4444;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        
        [data-theme="dark"] {
            --primary: #71717a;
            --primary-dark: #52525b;
            --surface: #27272a;
            --surface-alt: #18181b;
            --border: #3f3f46;
            --text: #fafafa;
            --text-secondary: #a1a1aa;
            --success: #34d399;
            --error: #f87171;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--surface-alt);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px var(--shadow);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: var(--primary);
            color: white;
        }
        
        .btn:hover {
            background: var(--primary-dark);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: var(--surface-alt);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .theme-toggle {
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.25rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1.5rem;
            overflow-x: auto;
            scrollbar-width: thin;
        }
        
        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: var(--text);
            background: var(--surface-alt);
        }
        
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Sync Module Cards */
        .sync-card {
            background: var(--surface);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 3px var(--shadow);
        }
        
        .sync-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            margin: -0.5rem -0.5rem 1rem -0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .sync-header:hover {
            background: var(--surface-alt);
        }
        
        .sync-name {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .sync-toggles {
            display: flex;
            gap: 1rem;
        }
        
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .toggle-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .toggle {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border);
            transition: 0.2s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: var(--success);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        /* Camera Grid */
        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            align-items: start;
        }
        
        .camera-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            height: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .camera-card:hover {
            background: var(--surface);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px var(--shadow);
        }
        
        .camera-name {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.5;
            display: flex;
            align-items: center;
        }
        
        .camera-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }
        
        .camera-toggles {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        /* Logs */
        .log-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .log-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            height: 600px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 0.25rem;
            word-wrap: break-word;
        }
        
        .log-entry.error {
            color: var(--error);
        }
        
        .log-entry.warn {
            color: #f59e0b;
        }
        
        .log-entry.info {
            color: var(--text-secondary);
        }
        
        /* Settings */
        .settings-section {
            background: var(--surface);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 3px var(--shadow);
        }
        
        .settings-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-input, .form-select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--surface-alt);
            color: var(--text);
            font-size: 0.875rem;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* Utility */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }
        
        #messageArea {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 400px;
            pointer-events: none;
        }
        
        .toast {
            padding: 1rem 1.25rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            color: white;
            font-weight: 500;
            pointer-events: auto;
            animation: slideIn 0.3s ease-out;
            max-width: 100%;
            word-wrap: break-word;
        }
        
        .toast.error {
            background: var(--error);
        }
        
        .toast.success {
            background: var(--success);
        }
        
        .toast.info {
            background: var(--primary);
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }
        
        .toast.hiding {
            animation: slideOut 0.3s ease-in forwards;
        }
        
        /* Legacy error/success classes for backward compatibility */
        .error {
            background: var(--error);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .success {
            background: var(--success);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .hidden {
            display: none;
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        
        .modal {
            background: var(--surface);
            border-radius: 0.75rem;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.125rem;
            font-weight: 600;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.25rem;
        }
        
        .modal-close:hover {
            background: var(--surface-alt);
            color: var(--text);
        }
        
        .modal-body {
            padding: 0;
        }
        
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--surface-alt);
        }
        
        .modal-tab {
            flex: 1;
            padding: 0.875rem 1rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.9375rem;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }
        
        .modal-tab:hover {
            background: var(--surface);
            color: var(--primary);
        }
        
        .modal-tab.active {
            color: var(--primary);
            background: var(--surface);
            border-bottom-color: var(--primary);
        }
        
        .modal-tab-content {
            padding: 1rem 1.25rem;
            display: none;
        }
        
        .modal-tab-content.active {
            display: block;
        }
        
        .modal-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 0.5rem;
        }
        
        .info-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.25rem;
            background: var(--surface-alt);
        }
        
        .info-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.8125rem;
        }
        
        .info-value {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.8125rem;
            word-break: break-all;
        }
        
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .setting-row:last-child {
            border-bottom: none;
        }
        
        .setting-info {
            flex: 1;
            padding-right: 1rem;
        }
        
        .setting-label {
            font-weight: 600;
            margin-bottom: 0.125rem;
            font-size: 0.9375rem;
        }
        
        .setting-description {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            line-height: 1.3;
        }
        
        .camera-buttons {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
            align-items: center;
        }
        
        .btn-icon {
            padding: 0;
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1;
            border-radius: 0.375rem;
            flex-shrink: 0;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-alt);
            color: var(--text);
            box-sizing: border-box;
        }
        
        .btn-icon:hover {
            background: var(--border);
        }
        
        .btn-icon:active {
            transform: scale(0.98);
        }
        
        .btn-icon.btn-secondary {
            background: var(--surface-alt);
            color: var(--text);
        }
        
        .btn-icon.btn-secondary:hover {
            background: var(--border);
        }
        
        .sync-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex: 1;
        }
        
        @media (max-width: 768px) {
            .sync-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .cameras-grid {
                grid-template-columns: 1fr;
            }
            
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .info-row {
                grid-template-columns: 1fr;
                gap: 0.25rem;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .modal {
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🎥 MyBlink</h1>
            <div class="controls">
                <button class="btn" id="refreshBtn">Refresh</button>
                <button class="btn btn-secondary" id="runJobsBtn">Run Jobs</button>
                <div class="theme-toggle" id="themeToggle">
                    <span id="themeIcon">🌙</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div id="messageArea"></div>
        
        <div id="loadingArea" class="loading">
            Loading...
        </div>
        
        <div id="tabsContainer" class="hidden">
            <div class="tabs" id="tabsNav">
                <!-- Tabs will be dynamically generated -->
            </div>
            
            <div id="tabsContent">
                <!-- Tab content will be dynamically generated -->
            </div>
        </div>
    </div>
    
    <!-- Modal Container -->
    <div id="modalContainer"></div>
    
    <script src="/static/app.js"></script>
</body>
</html>
